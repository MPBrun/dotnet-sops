name: Build
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    tags:
    - "v*.*.*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-27, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore
      
    - name: Restore tools
      run: dotnet tool restore

    - name: Find version number
      id: version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]
        then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT;
        else
          echo "VERSION=0.0.0-alpha.${{ github.run_number }}" >> $GITHUB_OUTPUT;
        fi

    - name: Lint - format
      run: dotnet format --no-restore --verify-no-changes

    - name: Lint - csharpier
      run: dotnet csharpier check .
      
    - name: Build
      run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Test
      run: dotnet test --no-build --configuration Release --output Detailed --coverage --coverage-output-format cobertura --coverage-output cobertura.xml --report-trx

    - name: Test Report
      uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # v16
      if: always()
      with:
        name: Test results (${{ matrix.os }})
        path: "**/*.trx"
        reporter: dotnet-trx
        output-to: 'step-summary'
        fail-on-error: false

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Pack for any
      run: |
        dotnet pack --configuration Release --runtime any -p:Version=${{ steps.version.outputs.VERSION }}
        dotnet pack --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Pack for ubuntu
      if: matrix.os == 'ubuntu-26.04'
      run: |
        dotnet pack --configuration Release --runtime linux-x64 -p:Version=${{ steps.version.outputs.VERSION }}
      
    - name: Pack for ubuntu arm
      if: matrix.os == 'ubuntu-26.04-arm'
      run: |
        dotnet pack --configuration Release --runtime linux-arm64 -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Pack for macos
      if: matrix.os == 'macos-27'
      run: |
        dotnet pack --configuration Release --runtime osx-x64 -p:Version=${{ steps.version.outputs.VERSION }}
        dotnet pack --configuration Release --runtime osx-arm64 -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Pack for windows
      if: matrix.os == 'windows-latest'
      run: |
        dotnet pack --configuration Release --runtime win-x64 -p:Version=${{ steps.version.outputs.VERSION }}
        dotnet pack --configuration Release --runtime win-arm64 -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: nuget-${{ matrix.os }}
        path: src/DotnetSops.CommandLine/bin/nupkg/*.*
        if-no-files-found: error
  
  test:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-latest]
        dotnet: ["10.x", "11.x"]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      with:
        fetch-depth: 1

    - name: Install .NET SDK
      uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
      id: dotnet-sdk
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Create global.json
      shell: bash
      run: |
        echo "{ \"sdk\": { \"version\": \"${{ steps.dotnet-sdk.outputs.dotnet-version }}\", \"rollForward\": \"disable\", \"allowPrerelease\": false } }" > global.json

    - name: Download NuGet artifact
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        name: nuget-${{ matrix.os }}
        path: ./src/DotnetSops.CommandLine/bin/nupkg

    - name: Test - Package
      shell: bash
      run: ./build/tool-test.sh

    - name: Upload NuGet artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.os == 'ubuntu-26.04'
      with:
        name: nuget
        path: src/DotnetSops.CommandLine/bin/nupkg/*.*
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download NuGet artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: nuget

    - name: Create release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: true
        generate_release_notes: true
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
        files: |
          *.nupkg
          *.snupkg
